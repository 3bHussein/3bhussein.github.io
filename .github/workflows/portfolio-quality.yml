name: Portfolio Quality Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portfolio structure and responsive theme
        run: python -m unittest discover -s tests -v
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check desktop and mobile layout
        run: python tests/browser_smoke.py
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore

  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local portfolio server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Audit mobile performance three times and desktop once
        run: |
          mkdir -p lighthouse-reports
          npx --yes lighthouse@12 http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output=html --output-path=./lighthouse-reports/desktop --quiet
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output=html --output-path="./lighthouse-reports/mobile-$i" --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          const names = ['desktop', 'mobile-1', 'mobile-2', 'mobile-3'];
          const results = names.map(name => {
            const r = JSON.parse(fs.readFileSync('lighthouse-reports/' + name + '.report.json', 'utf8'));
            const categories = Object.fromEntries(Object.entries(r.categories).map(([key, value]) => [key, Math.round(value.score * 100)]));
            const metrics = Object.fromEntries(['first-contentful-paint', 'largest-contentful-paint', 'total-blocking-time', 'cumulative-layout-shift', 'speed-index'].map(id => [id, r.audits[id]?.numericValue ?? null]));
            console.log(name, categories, metrics);
            return { name, categories, metrics };
          });
          const mobile = results.slice(1);
          const sorted = mobile.map(x => x.categories.performance).sort((a, b) => a - b);
          const summary = { mobilePerformanceMedian: sorted[1], mobilePerformanceRange: [sorted[0], sorted[2]], results };
          console.log('MOBILE PERFORMANCE MEDIAN:', summary.mobilePerformanceMedian, 'RANGE:', summary.mobilePerformanceRange.join('-'));
          fs.writeFileSync('lighthouse-reports/summary.json', JSON.stringify(summary, null, 2));
          const desktop = results[0].categories;
          const violations = [];
          if (desktop.performance < 90) violations.push('Desktop performance below 90');
          if (summary.mobilePerformanceMedian < 85) violations.push('Mobile median performance below 85');
          for (const result of results) {
            if (result.categories.accessibility < 95) violations.push(result.name + ': accessibility below 95');
            if (result.categories.seo < 95) violations.push(result.name + ': SEO below 95');
            if (result.categories['best-practices'] < 95) violations.push(result.name + ': best practices below 95');
          }
          if (violations.length) {
            console.error('Lighthouse quality gates failed:', violations.join('; '));
            process.exitCode = 1;
          } else {
            console.log('Lighthouse quality gates passed');
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
