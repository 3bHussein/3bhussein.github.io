name: Portfolio Quality Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portfolio structure and responsive theme
        run: python -m unittest discover -s tests -v
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check desktop and mobile layout
        run: python tests/browser_smoke.py
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
