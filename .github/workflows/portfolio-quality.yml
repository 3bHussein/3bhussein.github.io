name: Portfolio Quality Checks
on:
  pull_request:
  push:
    branches:
      - feature/professional-portfolio-refresh
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portfolio structure and responsive theme
        run: python -m unittest discover -s tests -v
